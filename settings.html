<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="top"><div class="brand">OUR LITTLE UNIVERSE<small>Settings</small></div><div class="orb">⚙</div></header><a class="back" href="index.html">← Dashboard</a><section class="card"><h3>⚙ Couple Settings</h3><div class="form"><input class="input" id="name1" placeholder="Your name"><input class="input" id="name2" placeholder="Partner name"><button class="btn" onclick="saveNames()">Save names</button></div><button class="btn" style="width:100%;margin-top:10px;background:linear-gradient(135deg,#7f1d1d,#dc2626)" onclick="logoutCouple()">🔒 Logout</button></section>
<section class="card" style="margin-top:12px">
  <div class="section-title">
    <div><div class="section-icon">👑</div><div><h3 style="margin:0">Owner</h3><div class="muted">Owner account & Gmail</div></div></div>
  </div>
  <div class="form">
    <input class="input" id="ownerName" placeholder="Owner Name">
    <input class="input" id="ownerGmail" type="email" inputmode="email" autocomplete="email" placeholder="Owner Gmail">
    <input class="input" id="googleClientId" placeholder="Google OAuth Client ID">
    <div id="ownerStatus" class="muted">Owner Gmail မချိတ်ရသေးပါ</div>
    <button class="btn" onclick="saveOwnerSettings()">💾 Save Owner Gmail</button>
    <button class="back" style="width:100%;justify-content:center" onclick="saveGoogleClientId()">🔐 Save Google Client ID</button>
    <button class="back" style="width:100%;justify-content:center" onclick="connectOwnerGoogle()">🔗 Connect with Google</button>
    <div id="ownerError" class="error-note"></div>
  </div>
  <p class="muted" style="margin-top:10px">Google နဲ့ တကယ်ချိတ်ရန် Google Cloud မှာ Web OAuth Client ID တစ်ခုဖန်တီးပြီး အပေါ်မှာထည့်ပါ။ Client ID က secret မဟုတ်ပါ။</p>
</section>
</main><script src="https://accounts.google.com/gsi/client" async defer></script><script src="app.js"></script></body></html>
