<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Story</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="top"><div class="brand">OUR LITTLE UNIVERSE<small>Our Story</small></div><div class="orb">♡</div></header><a class="back" href="index.html">← Dashboard</a><section class="hero"><div class="eyebrow">OUR STORY</div><h1>Together.</h1><p class="muted">Your relationship time and anniversary countdown.</p></section><section class="grid"><div class="card"><div class="muted">TOGETHER FOR</div><h3 id="duration">Set date</h3></div><div class="card"><div class="muted">ANNIVERSARY</div><h3 id="anniv">—</h3></div></section><section class="card" style="margin-top:10px"><h3>Relationship start</h3><div class="form"><input class="input" id="startDate" type="datetime-local"><button class="btn" onclick="saveDate()">Save date</button></div></section></main><script src="app.js"></script><script>function update(){if(!data.start){$('anniv').textContent='Set date';return}let s=new Date(data.start),n=new Date(),a=new Date(n.getFullYear(),s.getMonth(),s.getDate());if(a<=n)a.setFullYear(n.getFullYear()+1);let ms=a-n,d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60;$('anniv').textContent=d+'d '+h+'h '+m+'m'}setInterval(update,1000);update()</script></body></html>
