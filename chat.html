<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="top"><div class="brand">OUR LITTLE UNIVERSE<small>Private Chat</small></div><div class="orb">💬</div></header><a class="back" href="index.html">← Dashboard</a><section class="card"><h3>💬 Our Chat</h3><div class="muted">Private chat · Photo / Location / Voice ပါဝင်သည်။</div><div class="chat" id="chatbox"></div><div class="two-inputs" style="margin-top:10px"><select class="input" id="senderSelect"></select><label class="btn">📷 Photo<input type="file" accept="image/*" hidden onchange="addPhoto(this)"></label></div><div class="composer"><input class="input" id="chatInput" placeholder="Write something sweet…"><button class="btn" onclick="sendMsg()">Send</button></div><div class="two-inputs" style="margin-top:8px"><button class="btn" onclick="shareLocation()">📍 Location</button><button class="btn" onclick="toggleVoice()">🎙️ Voice</button></div></section></main><script src="app.js"></script><script type="module" src="firebase-client.js"></script><script>const s=document.getElementById("senderSelect");if(s){s.innerHTML=(data.names||[]).filter(Boolean).map(n=>"<option>"+n+"</option>").join("");s.value=localStorage.getItem("coupleSender")||data.names[0]||"";s.onchange=()=>setSender(s.value)}</script></body></html>
