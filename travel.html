<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell">
<header class="top"><div class="brand">OUR LITTLE UNIVERSE<small>Travel</small></div><div class="orb">✈️</div></header>
<a class="back" href="index.html">← Dashboard</a>

<section class="card">
<h3>✈️ Create a Trip</h3>
<div class="muted">ခရီးစဉ်အမည်တစ်ခုအောက်မှာ လမ်းကြောင်းအဆင့်ဆင့်နဲ့ ကုန်ကျစရိတ်တွေကို ထည့်နိုင်ပါတယ်။</div>
<div id="tripError" class="muted" style="display:none;color:#fca5a5;margin-top:10px"></div><div class="form" style="margin-top:10px">
<label class="muted">ခရီးစဉ်အမည်</label><input class="input" id="tripName" placeholder="ဥပမာ Bangkok Trip" required>
<label class="muted">သွားမည့်နေရာ</label><input class="input" id="destination" placeholder="ဥပမာ Bangkok" required>
<label class="muted">ခရီးစဉ်ရက်စွဲ</label><input class="input" id="tripDate" type="date">
<button class="btn" onclick="createTrip()">+ Create Trip</button>
</div>
</section>

<section class="card" style="margin-top:10px">
<h3>🧭 Add Route / Car Step</h3>
<div class="form">
<select class="input" id="tripSelect"><option value="">ခရီးစဉ်ရွေးပါ</option></select>
<input class="input" id="route" placeholder="လမ်းကြောင်း / ကားအဆင့် (ဥပမာ Pattaya → Bangkok)">
<input class="input" id="expense" type="number" min="0" placeholder="ကုန်ကျစရိတ် (THB)">
<select class="input" id="expenseType"><option>Transport</option><option>Food</option><option>Hotel</option><option>Tickets</option><option>Fuel</option><option>Shopping</option><option>Other</option></select>
<button class="btn" onclick="addRouteStep()">+ Add Route Step</button>
</div>
</section>

<section class="card" style="margin-top:10px">
<h3>🚗 Active Trips</h3><div id="trips"></div>
</section>
</main><script src="app.js"></script></body></html>
