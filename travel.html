<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="top"><div class="brand">OUR LITTLE UNIVERSE<small>Travel</small></div><div class="orb">✈️</div></header><a class="back" href="index.html">← Dashboard</a><section class="card"><h3>✈️ Plan a Trip</h3><div class="form"><input class="input" id="tripName" placeholder="Trip name"><input class="input" id="destination" placeholder="Destination"><input class="input" id="tripDate" type="date"><input class="input" id="route" placeholder="Route / next stop"><input class="input" id="expense" type="number" min="0" placeholder="Expense (THB)"><select class="input" id="expenseType"><option>Transport</option><option>Food</option><option>Hotel</option><option>Tickets</option><option>Fuel</option><option>Shopping</option><option>Other</option></select><button class="btn" onclick="addTrip()">Save step</button></div></section><section class="card" style="margin-top:10px"><h3>Active Trips</h3><div id="trips"></div></section></main><script src="app.js"></script></body></html>
